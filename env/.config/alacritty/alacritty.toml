[general]
import = [
    "./themes/rose-pine.toml",
]

[window]
opacity = 0.7

[colors.primary]
background = "#000000"

[font]
size = 16

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrains Mono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrains Mono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrains Mono Nerd Font"
style = "Bold Italic"

[cursor.style]
shape = "Block"
blinking = "Always"
